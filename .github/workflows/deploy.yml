name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 2202
          source: "./"
          target: "/home/vsmwrurd/ai_registration_engine"
          strip_components: 0
          exclude: |
            .git
            .github
            .env
            *.db
            *.sqlite
            *.sqlite3
            virtualenv
            tmp
            __pycache__

      - name: Restart Phusion Passenger
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 2202
          script: |
            cd /home/vsmwrurd/ai_registration_engine
            mkdir -p tmp
            touch tmp/restart.txt
